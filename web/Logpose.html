function parseSnippet(raw) {
  if (!raw) return [""];
  const parts = [];
  raw.split("@@").forEach((seg, i) => {
    if (!seg) return;
    if (i % 2 === 0) parts.push(seg);
    else parts.push({ mark: seg });
  });
  return parts.length ? parts : [raw];
}
function fmtAgo(iso) {
  if (!iso) return "—";
  try {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  } catch(e) { return "—"; }
}
const StatsCtx = React.createContext({});
const StatsRefreshCtx = React.createContext(() => {});
const NavCtx = React.createContext(() => {});
function useStats() { return React.useContext(StatsCtx); }
function useRefreshStats() { return React.useContext(StatsRefreshCtx); }

function StatusRow({ chunks, files, indexedAgo }) {
  const stats = useStats();
  const c = chunks ?? (stats.total_chunks != null ? stats.total_chunks.toLocaleString() : "…");
  const f = files ?? (stats.total_files != null ? stats.total_files.toLocaleString() : "…");
  const ago = indexedAgo ?? fmtAgo(stats.last_indexed);
  return (
    <div className="lp-mono" style={{ display: "flex", alignItems: "center", gap: 10,
      fontSize: 12, color: LP.muted, letterSpacing: 0 }}>
      <span className="lp-livedot" />
      <span>{c} chunks across {f} files — last indexed {ago}</span>
    </div>
  );
}

function ResultCard({ r, active, onOpen, onAskFollowup }) {
  const [copied, setCopied] = React.useState(false);
  const [opened, setOpened] = React.useState(false);
  const openFile = (e) => {
    e.stopPropagation();
    fetch(`${API_BASE}/api/open-file`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: r.path}),
    }).then(() => { setOpened(true); setTimeout(() => setOpened(false), 1500); }).catch(() => {});
  };
  const copyPath = (e) => {
    e.stopPropagation();
    navigator.clipboard.writeText(r.path)
      .then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); })
      .catch(() => {});
  };
  const followUp = (e) => {
    e.stopPropagation();
    onOpen();
    if (onAskFollowup) onAskFollowup(r);
  };
  return (
    <div className={"lp-result-card" + (active ? " active" : "")} onClick={onOpen}>
      <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
        <FileTypeBadge kind={r.kind} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
            <h3 style={{ margin: 0, fontSize: 16, fontWeight: 600, letterSpacing: "-0.012em" }}>{r.file}</h3>
            <span className="lp-cite-pill">{r.cite}</span>
          </div>
          <div className="lp-mono" style={{ fontSize: 12, color: LP.muted, marginBottom: 16, letterSpacing: 0 }}>
            {r.path}
            <span style={{ margin: "0 8px", color: LP.dim }}>·</span>
            score {r.score.toFixed(2)}
            <span style={{ margin: "0 8px", color: LP.dim }}>·</span>
            modified {r.mod}
          </div>
          <Snippet parts={r.snippet} mono={r.kind === "code" || r.kind === "xlsx"} />
          {r.metadata && (r.metadata.entities || r.metadata.topics) && (
            <div className="result-badges">
              {r.metadata.topics && r.metadata.topics.split(', ').slice(0, 3).map(topic => (
                <span key={topic} className="badge badge-topic">{topic}</span>
              ))}
              {r.metadata.entities && r.metadata.entities.split(', ').slice(0, 4).map(entity => (
                <span key={entity} className="badge badge-entity">{entity}</span>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
            <button className="lp-row-btn" onClick={openFile}><Icon.external size={12}/> {opened ? "Opened!" : "Open file"}</button>
            <button className="lp-row-btn" onClick={copyPath}><Icon.copy size={12}/> {copied ? "Copied!" : "Copy path"}</button>
            <button className="lp-row-btn" onClick={followUp}><Icon.message size={12}/> Ask follow-up</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FilterRail({ rerank, setRerank, activeTypes, setActiveTypes, activeFolder, setActiveFolder }) {
  const stats = useStats();
  const toggle = (t) => setActiveTypes(a => a.includes(t) ? a.filter(x => x !== t) : [...a, t]);

  // Build file-type counts from real stats.file_types
  const ft = stats.file_types || {};
  const extMap = {
    PDF: [".pdf"], DOCX: [".docx", ".doc"], Code: [".py", ".js", ".ts", ".jsx", ".tsx", ".go", ".rs", ".java", ".cpp", ".c"],
    XLSX: [".xlsx", ".xls"], Markdown: [".md", ".markdown"], EPUB: [".epub"],
  };
  const countFor = (label) => extMap[label] ? extMap[label].reduce((s, e) => s + (ft[e] || 0), 0) || null : null;

  // Real source folders from stats
  const folders = ["All folders", ...(stats.sources || ["ICICI", "Finance", "code/ledger", "notes"])];

  const Section = ({ title, children }) => (
    <div style={{ marginBottom: 32 }}>
      <div className="lp-eyebrow" style={{ marginBottom: 14, fontSize: 10 }}>{title}</div>

  );
  const Check = ({ label, on, onClick, count }) => (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0",
      cursor: "pointer", color: on ? LP.fg : LP.muted, fontSize: 13, fontWeight: 500 }}>
      <span className={"lp-checkbox" + (on ? " on" : "")}>
        {on && <Icon.check size={11} stroke="#0A0A0A" sw={2}/>}
      </span>
      <span style={{ flex: 1 }}>{label}</span>
      <span className="lp-mono" style={{ fontSize: 11, color: LP.dim }}>{count}</span>
    </div>
  );
  const Radio = ({ label, on, onClick }) => (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0",
      cursor: "pointer", color: on ? LP.fg : LP.muted, fontSize: 13, fontWeight: 500 }}>
      <span style={{ width: 14, height: 14, borderRadius: "50%", border: `1px solid ${on ? LP.amber : LP.rule2}`,
        display: "inline-flex", alignItems: "center", justifyContent: "center" }}>

      </span>
      <span>{label}</span>
    </div>
  );
  return (
    <aside style={{ width: "100%" }}>
      <Section title="File type">
        {["PDF", "DOCX", "Code", "XLSX", "Markdown", "EPUB"].map(t => (
          <Check key={t} label={t} on={activeTypes.includes(t)} onClick={() => toggle(t)} count={countFor(t)} />
        ))}
      </Section>
      <Section title="Source folder">
        {folders.map(f => (
          <Radio key={f} label={f} on={activeFolder === f} onClick={() => setActiveFolder(f)} />
        ))}
      </Section>
      <Section title="Date modified">
        <div style={{ position: "relative", height: 40, marginTop: 4 }}>
          <div style={{ position: "absolute", top: 18, left: 0, right: 0, height: 2, background: LP.rule }} />
          <div style={{ position: "absolute", top: 18, left: "20%", width: "60%", height: 2, background: LP.amber }} />
          <div style={{ position: "absolute", top: 12, left: "20%", width: 14, height: 14, borderRadius: "50%",
            background: LP.bg, border: `2px solid ${LP.amber}`, transform: "translateX(-7px)" }} />
          <div style={{ position: "absolute", top: 12, left: "80%", width: 14, height: 14, borderRadius: "50%",
            background: LP.bg, border: `2px solid ${LP.amber}`, transform: "translateX(-7px)" }} />
        </div>
        <div className="lp-mono" style={{ display: "flex", justifyContent: "space-between",
          fontSize: 11, color: LP.muted, marginTop: 4 }}>
          <span>2024</span><span>last 90 days</span>
        </div>
      </Section>
      <Section title="Retrieval">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 0" }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 500, color: LP.fg }}>Cross-encoder</div>

function ChatPanel({ result, onClose, expanded, onToggleExpand, onBackToPreview }) {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState("");
  const [asking, setAsking] = React.useState(false);
  const bottomRef = React.useRef(null);
  const inputRef = React.useRef(null);

  React.useEffect(() => { setMessages([]); setInput(""); }, [result && result.id]);
  React.useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
  React.useEffect(() => { setTimeout(() => inputRef.current?.focus(), 80); }, [result && result.id, expanded]);

  const send = async () => {
    const q = input.trim();
    if (!q || asking) return;
    const hist = [...messages, { role: "user", content: q }];
    setMessages(hist);
    setInput("");
    setAsking(true);
    try {
      const r = await fetch(`${API_BASE}/api/ask-followup`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, path: result.path, chunk_text: result.chunk_text || "" }),
      });
      const d = await r.json();
      setMessages([...hist, { role: "assistant", content: d.answer || d.error || "No response." }]);
    } catch(e) {
      setMessages([...hist, { role: "assistant", content: "Error: start aether-logpose-ui to use chat." }]);
    } finally { setAsking(false); }
  };

  const headerJsx = (
    <div style={{ display: "flex", alignItems: "center", padding: "13px 16px",
      borderBottom: `1px solid ${LP.rule}`, gap: 10, flexShrink: 0, background: LP.bg }}>
      {onBackToPreview && (
        <button className="lp-row-btn" style={{ padding: "0 8px", gap: 5, fontSize: 11 }}
          onClick={onBackToPreview} title="Back to preview">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Doc
        </button>
      )}
      <FileTypeBadge kind={result.kind} size={26}/>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis",
          whiteSpace: "nowrap", letterSpacing: "-0.01em" }}>{result.file}</div>
        <div className="lp-mono" style={{ fontSize: 9, color: LP.muted, marginTop: 1 }}>
          {result.cite || "—"} · score {result.score}
        </div>
      </div>
      <button className="lp-row-btn" style={{ padding: "0 8px", gap: 5, fontSize: 11 }}
        onClick={onToggleExpand} title={expanded ? "Collapse" : "Expand to full screen"}>
        {expanded
          ? <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
          : <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>}
      </button>
      <button className="lp-row-btn" style={{ padding: "0 7px" }} onClick={onClose}><Icon.close size={12}/></button>
    </div>
  );

  const threadJsx = (flexVal) => (
    <div style={{ flex: flexVal || 1, overflow: "auto", padding: "20px 22px",
      display: "flex", flexDirection: "column", gap: 14 }}>
      {messages.length === 0 && (
        <div style={{ textAlign: "center", padding: "48px 0", color: LP.dim, fontSize: 13 }}>
          <div style={{ fontSize: 28, marginBottom: 12, color: LP.rule2 }}>✦</div>
          Ask anything about this document.
        </div>
      )}
      {messages.map((m, i) => (
        <div key={i} style={{ display: "flex",
          flexDirection: m.role === "user" ? "row-reverse" : "row", gap: 10 }}>
          <div style={{
            maxWidth: "88%", padding: "10px 14px", fontSize: 13.5, lineHeight: 1.65,
            borderRadius: m.role === "user" ? "12px 12px 2px 12px" : "12px 12px 12px 2px",
            background: m.role === "user" ? LP.amberDim : "#141414",
            border: `1px solid ${m.role === "user" ? LP.amberRule : LP.rule2}`,
            color: m.role === "user" ? LP.amber : LP.fg,
          }}>{m.content}</div>
        </div>
      ))}
      {asking && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", color: LP.muted, fontSize: 12 }}>
          <div style={{ width: 12, height: 12, borderRadius: "50%", border: `1.5px solid ${LP.rule2}`,
            borderTopColor: LP.amber, animation: "lp-spin 1.4s linear infinite" }} />
          Thinking…
        </div>
      )}
      <div ref={bottomRef} />
    </div>
  );

  const inputBarJsx = (
    <div style={{ padding: "14px 18px", borderTop: `1px solid ${LP.rule}`, background: LP.bg, flexShrink: 0 }}>
      <div style={{ position: "relative" }}>
        <input ref={inputRef} className="lp-input"
          style={{ paddingLeft: 16, paddingRight: 48, height: 42, borderRadius: 8 }}
          placeholder="Ask about this document…"
          value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && !e.shiftKey && send()} />
        <div style={{ position: "absolute", top: 0, right: 8, height: 42, display: "flex", alignItems: "center" }}>
          {asking
            ? <div style={{ width: 14, height: 14, borderRadius: "50%", border: `1.5px solid ${LP.rule2}`,
                borderTopColor: LP.amber, animation: "lp-spin 1.4s linear infinite" }} />
            : <button onClick={send} style={{ background: "none", border: "none", cursor: "pointer",
                color: input.trim() ? LP.amber : LP.dim, fontSize: 18, padding: 0, lineHeight: 1 }}>↑</button>}
        </div>
      </div>
      <div className="lp-mono" style={{ fontSize: 9, color: LP.dim, marginTop: 7,
        letterSpacing: 0.12, textTransform: "uppercase" }}>
        Scoped to {result.file} · Ollama
      </div>
    </div>
  );

  if (expanded) {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 200, background: LP.bg, display: "flex" }}>
        <div style={{ flex: 1, overflow: "auto", padding: "48px 56px", borderRight: `1px solid ${LP.rule}` }}>
          <div style={{ display: "flex", gap: 16, alignItems: "flex-start", marginBottom: 36 }}>
            <FileTypeBadge kind={result.kind} size={44}/>
            <div>
              <div style={{ fontSize: 20, fontWeight: 600, letterSpacing: "-0.015em" }}>{result.file}</div>
              <div className="lp-mono" style={{ fontSize: 11, color: LP.muted, marginTop: 4 }}>{result.path}</div>
              <div className="lp-mono" style={{ fontSize: 11, color: LP.dim, marginTop: 2 }}>
                {result.cite || "—"} · score {result.score} · {result.mod}
              </div>
            </div>
          </div>
          <div style={{ borderLeft: `2px solid ${LP.amber}`, background: "rgba(255,159,28,0.04)",
            padding: "22px 26px", borderRadius: "0 6px 6px 0", marginBottom: 32 }}>
            <div className="lp-mono" style={{ fontSize: 10, color: LP.amber, letterSpacing: 0.12,
              textTransform: "uppercase", marginBottom: 12 }}>Matched chunk · score {result.score}</div>
            <Snippet parts={result.snippet} mono={result.kind === "code"} />
          </div>
        </div>
        <div style={{ width: 560, display: "flex", flexDirection: "column" }}>
          {headerJsx}
          {threadJsx(1)}
          {inputBarJsx}
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%",
      background: "#0A0A0A", overflow: "hidden" }}>
      {headerJsx}
      {threadJsx(1)}
      {inputBarJsx}
    </div>
  );
}

function SearchResults() {
  const [query, setQuery] = React.useState(() => {
    const hash = typeof window !== 'undefined' ? window.location.hash : '';
    if (hash.includes('?q=')) {
      const qs = hash.split('?')[1] || '';
      const params = Object.fromEntries(qs.split('&').map(p => p.split('=')));
      return params.q ? decodeURIComponent(params.q) : '';
    }
    return "";
  });
  const [_initFt] = React.useState(() => {
    const hash = typeof window !== 'undefined' ? window.location.hash : '';
    if (hash.includes('?')) {
      const qs = hash.split('?')[1] || '';
      const params = Object.fromEntries(qs.split('&').map(p => p.split('=')));
      return params.ft ? [params.ft] : [];
    }
    return [];
  });
  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [searchError, setSearchError] = React.useState(null);
  const [durationMs, setDurationMs] = React.useState(null);
  const [active, setActive] = React.useState(null);
  const [rerank, setRerank] = React.useState(true);
  const [live, setLive] = React.useState(false);
  const [activeTypes, setActiveTypes] = React.useState(_initFt);
  const [activeFolder, setActiveFolder] = React.useState("All folders");
  const [chatTarget, setChatTarget] = React.useState(null);
  const [chatExpanded, setChatExpanded] = React.useState(false);
  const [selfRagEnabled, setSelfRagEnabled] = React.useState(false);
  const [agentMode, setAgentMode] = React.useState(false);
  const [agentResult, setAgentResult] = React.useState(null);
  const [showGraph, setShowGraph] = React.useState(false);
  const [graphData, setGraphData] = React.useState(null);

  const extMap = {
    PDF: [".pdf"], DOCX: [".docx", ".doc"],
    Code: [".py", ".js", ".ts", ".jsx", ".tsx", ".go", ".rs", ".java", ".cpp", ".c"],
    XLSX: [".xlsx", ".xls"], Markdown: [".md", ".markdown"], EPUB: [".epub"],
  };

  const loadGraph = async () => {
    if (graphData) return;
    try {
      const resp = await fetch(`${API_BASE}/api/graph`);
      const data = await resp.json();
      setGraphData(data);
    } catch (e) { console.error('Graph load failed', e); }
  };

  const doSearch = React.useCallback(async (q, types, folder, useSelfRag, useAgent) => {
    if (!q || !q.trim()) {
      setResults([]);
      setSearchError(null);
      setAgentResult(null);
      setLoading(false);
      return;
    }
    setLoading(true);
    setSearchError(null);
    setAgentResult(null);
    try {
      if (useAgent) {
        const r = await fetch(`${API_BASE}/api/agent-search`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }),
        });
        if (!r.ok) {
          const errData = await r.json().catch(() => ({}));
          setSearchError(errData.error || `Agent search error ${r.status}`);
          setLoading(false);
          return;
        }
        const data = await r.json();
        setAgentResult(data);
        setLive(true);
        setResults([]);
        setDurationMs(null);
      } else {
        const exts = (types || []).flatMap(t => extMap[t] || []);
        const typesParam = exts.length ? `&types=${exts.join(",")}` : "";
        const srcParam = (folder && folder !== "All folders") ? `&source=${encodeURIComponent(folder)}` : "";
        const selfRagParam = useSelfRag ? "&self_rag=1" : "";
        const r = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}&n=10${typesParam}${srcParam}${selfRagParam}`);
        if (!r.ok) {
          const errData = await r.json().catch(() => ({}));
          setSearchError(errData.error || `Server error ${r.status} — Ollama may be busy`);
          setLoading(false);
          return;
        }
        const data = await r.json();
        if (data.results) {
          setLive(true);
          setResults(data.results.map(r => ({
            id: r.id, kind: r.kind, file: r.file, path: r.path,
            cite: r.cite, score: r.score, mod: r.mod,
            snippet: parseSnippet(r.snippet_raw),
            chunk_text: r.chunk_text || "",
            metadata: r.metadata || {},
          })));
          setDurationMs(data.duration_ms);
        }
      }
    } catch(e) {
      if (e.name !== 'TypeError') setSearchError("Cannot reach server — start aether-logpose-ui");
    }
    finally { setLoading(false); }
  }, []);

  React.useEffect(() => { doSearch(query, [], "All folders", false, false); }, [doSearch]);

  const handleSearch = (q) => { setQuery(q); doSearch(q, activeTypes, activeFolder, selfRagEnabled, agentMode); };
  const handleTypesChange = (types) => {
    setActiveTypes(types);
    if (query) doSearch(query, types, activeFolder, selfRagEnabled, agentMode);
  };
  const handleFolderChange = (folder) => {
    setActiveFolder(folder);
    if (query) doSearch(query, activeTypes, folder, selfRagEnabled, agentMode);
  };

  const activeResult = active ? results.find(r => r.id === active) : null;
  // Right panel: chat takes priority over preview when both targets are set
  const rightMode = chatTarget ? "chat" : (activeResult ? "preview" : null);
  const displayed = results.slice(0, 10);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
      {/* Top search bar \u2014 always visible */}
      <SearchTopBar query={query} onSearch={handleSearch}
        selfRagEnabled={selfRagEnabled} setSelfRagEnabled={setSelfRagEnabled}
        agentMode={agentMode} setAgentMode={setAgentMode} />

      {/* Body: filter | results | right-panel */}
      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>

        {/* Filter rail \u2014 scrollable, fixed width */}
        <div style={{ width: 200, flexShrink: 0, overflowY: "auto",
          padding: "28px 0 28px 28px", borderRight: `1px solid ${LP.rule}` }}>
          <FilterRail rerank={rerank} setRerank={setRerank}
            activeTypes={activeTypes} setActiveTypes={handleTypesChange}
            activeFolder={activeFolder} setActiveFolder={handleFolderChange} />
        </div>

        {/* Results list \u2014 scrollable */}
        <div style={{ flex: 1, overflowY: "auto", padding: "28px 32px",
          transition: "all 200ms ease-out", minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 14 }}>
              <h2 style={{ margin: 0, fontSize: 18, fontWeight: 600, letterSpacing: "-0.015em" }}>
                {loading ? "Searching\u2026"
                  : <>{results.length} results{query && <> for <span style={{ color: LP.amber }}>"{query}"</span></>}</>}
              </h2>
              {!loading && live && durationMs != null && (
                <span className="lp-mono" style={{ fontSize: 10, color: LP.muted }}>
                  hybrid \u00b7 RRF \u00b7 {durationMs} ms
                </span>
              )}
              {!loading && !live && (
                <span className="lp-mono" style={{ fontSize: 10, color: LP.dim }}>
                  start aether-logpose-ui
                </span>
              )}
            </div>
            <button className="lp-pill">Sort: relevance</button>
          </div>

          {agentResult && (
            <div className="agent-answer-card">
              <div className="agent-answer-header">\ud83e\udd16 Agent Answer</div>
              <div className="agent-answer-body">{agentResult.answer}</div>
              {agentResult.citations && agentResult.citations.length > 0 && (
                <div className="agent-citations">
                  <strong>Sources:</strong>
                  <ul>{agentResult.citations.map((c, i) => <li key={i}>{c.split('/').pop()}</li>)}</ul>
                </div>
              )}
              {agentResult.reasoning_trace && agentResult.reasoning_trace.length > 0 && (
                <details className="agent-trace">
                  <summary>Reasoning trace ({agentResult.steps_used} steps)</summary>
                  <pre>{agentResult.reasoning_trace.join('\n')}</pre>
                </details>
              )}
            </div>
          )}

          {loading && (
            <div style={{ textAlign: "center", padding: "80px 0", color: LP.muted }}>
              <div style={{ width: 18, height: 18, borderRadius: "50%", border: `2px solid ${LP.rule2}`,
                borderTopColor: LP.amber, display: "inline-block",
                animation: "lp-spin 1.4s linear infinite", marginBottom: 14 }} />
              <div style={{ fontSize: 13 }}>Searching\u2026</div>
            </div>
          )}
          {!loading && searchError && (
            <div style={{ padding: "20px 18px", borderRadius: 8, border: "1px solid #3a2000",
              background: "rgba(255,100,0,0.05)", color: "#ff8c42", fontSize: 13, marginBottom: 8 }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>Search error</div>
              <div style={{ color: LP.muted }}>{searchError}</div>
            </div>
          )}
          {!loading && !searchError && results.length === 0 && query && (
            <div style={{ textAlign: "center", padding: "80px 0", color: LP.muted, fontSize: 14 }}>
              No results for "{query}".
            </div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {!loading && displayed.map(r => (
              <ResultCard key={r.id} r={r} active={active === r.id}
                onOpen={() => { setActive(active === r.id ? null : r.id); setChatTarget(null); }}
                onAskFollowup={(target) => { setActive(target.id); setChatTarget(target); }} />
            ))}
            {results.length > 10 && (
              <div style={{ textAlign: "center", padding: "20px 0", color: LP.dim, fontSize: 12 }}
                className="lp-mono">
                \u2193 {results.length - 10} more
              </div>
            )}
          </div>

          <button className="graph-toggle-btn" onClick={() => { setShowGraph(!showGraph); if (!showGraph) loadGraph(); }}>
            {showGraph ? '\u25b2 Hide Graph' : '\u25bc Show Document Graph'}
          </button>

          {showGraph && graphData && (
            graphData.edges && graphData.edges.length > 0 ? (
              <div className="graph-panel">
                <div className="graph-title">Document Relationships ({graphData.edges.length} edges)</div>
                <div className="graph-edges">
                  {graphData.edges.slice(0, 50).map((edge, i) => (
                    <div key={i} className="graph-edge">
                      <span className="graph-node">{edge.source.split('/').pop()}</span>
                      <span className={`graph-rel graph-rel-${edge.type}`}>{edge.type}</span>
                      <span className="graph-node">{edge.target.split('/').pop()}</span>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="graph-panel">
                <div className="graph-title" style={{ color: '#718096', fontWeight: 400 }}>
                  {graphData.enabled === false ? 'Document graph not enabled.' : 'No document relationships found yet.'}
                </div>
              </div>
            )
          )}
        </div>

        {/* Right panel: preview OR chat \u2014 46% width, non-fixed */}
        {rightMode && (
          <div style={{
            flex: "0 0 46%", maxWidth: 760,
            borderLeft: `1px solid ${LP.rule}`,
            display: "flex", flexDirection: "column",
            overflow: "hidden",
            transition: "all 200ms ease-out",
          }}>
            {rightMode === "chat"
              ? <ChatPanel
                  result={chatTarget}
                  expanded={chatExpanded}
                  onToggleExpand={() => setChatExpanded(v => !v)}
                  onClose={() => { setChatTarget(null); setChatExpanded(false); }}
                  onBackToPreview={() => setChatTarget(null)} />
              : <ResultPreview
                  result={activeResult}
                  onClose={() => { setActive(null); setChatTarget(null); }}
                  onOpenChat={(r) => setChatTarget(r)} />
            }
          </div>
        )}
      </div>
    </div>
  );
}


function ResultPreview({ result, onClose, onOpenChat }) {
  const [chunks, setChunks] = React.useState(null);   // null=loading, []+=loaded
  const [loadErr, setLoadErr] = React.useState(null);
  const matchRef = React.useRef(null);
  const scrollRef = React.useRef(null);

  // Extract chunk_index from result.id  ("path::N")
  const matchedChunkIdx = React.useMemo(() => {
    const parts = (result.id || "").split("::");
    return parts.length >= 2 ? parseInt(parts[parts.length - 1], 10) : 0;
  }, [result.id]);

  // Load full document whenever result changes
  React.useEffect(() => {
    setChunks(null);
    setLoadErr(null);
    const url = `${API_BASE}/api/file-content?path=${encodeURIComponent(result.path)}`;
    fetch(url)
      .then(r => r.json())
      .then(d => {
        if (d.error) { setLoadErr(d.error); setChunks([]); }
        else setChunks(d.chunks || []);
      })
      .catch(e => { setLoadErr(String(e)); setChunks([]); });
  }, [result.id]);

  // Auto-scroll matched chunk into view once loaded
  React.useEffect(() => {
    if (chunks && matchRef.current && scrollRef.current) {
      setTimeout(() => {
        matchRef.current?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 80);
    }
  }, [chunks]);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%",
      background: "#0B0B0B", overflow: "hidden" }}>

      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", padding: "16px 20px",
        borderBottom: `1px solid ${LP.rule}`, gap: 12, flexShrink: 0 }}>
        <FileTypeBadge kind={result.kind} size={32}/>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: "-0.01em",
            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{result.file}</div>
          <div className="lp-mono" style={{ fontSize: 10, color: LP.muted, marginTop: 2,
            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{result.path}</div>
        </div>
        <button className="lp-row-btn"
          onClick={() => fetch(`${API_BASE}/api/open-file`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:result.path})}).catch(()=>{})}>
          <Icon.external size={12}/> Open
        </button>
        <button className="lp-row-btn"
          onClick={() => navigator.clipboard.writeText(result.path).catch(()=>{})}>
          <Icon.copy size={12}/>
        </button>
        <button className="lp-row-btn" style={{ padding: "0 8px" }} onClick={onClose}>
          <Icon.close size={13}/>
        </button>
      </div>

      {/* Meta strip */}
      <div style={{ padding: "8px 20px", borderBottom: `1px solid ${LP.rule}`,
        display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
        <span className="lp-cite-pill">{result.cite || "Matched segment"}</span>
        <span className="lp-mono" style={{ fontSize: 10, color: LP.dim }}>score {result.score}</span>
        <span style={{ color: LP.rule2 }}>·</span>
        <span className="lp-mono" style={{ fontSize: 10, color: LP.dim }}>{result.mod}</span>
        {chunks && <span style={{ color: LP.rule2 }}>·</span>}
        {chunks && <span className="lp-mono" style={{ fontSize: 10, color: LP.dim }}>{chunks.length} chunks</span>}
        <div style={{ flex: 1 }} />
        <button className="lp-row-btn" onClick={() => onOpenChat(result)}>
          <Icon.message size={11}/> Chat
        </button>
      </div>

      {/* Scrollable full-doc body */}
      <div ref={scrollRef} style={{ flex: 1, overflow: "auto", padding: "20px 22px" }}>

        {/* Loading state */}
        {!chunks && !loadErr && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, color: LP.dim, fontSize: 13 }}>
            <div style={{ width: 14, height: 14, borderRadius: "50%",
              border: `1.5px solid ${LP.rule2}`, borderTopColor: LP.amber,
              animation: "lp-spin 1.4s linear infinite", flexShrink: 0 }} />
            Loading full document…
          </div>
        )}

        {/* Error state */}
        {loadErr && (
          <div style={{ color: "#e05252", fontSize: 12, fontFamily: "monospace", padding: "10px 14px",
            background: "rgba(224,82,82,0.07)", borderRadius: 6, border: "1px solid rgba(224,82,82,0.25)" }}>
            {loadErr}
          </div>
        )}

        {/* All chunks rendered in order */}
        {chunks && chunks.map((chunk, i) => {
          const isMatch = chunk.chunk_index === matchedChunkIdx;
          return (
            <div key={chunk.chunk_index}
              ref={isMatch ? matchRef : null}
              style={{
                marginBottom: 12,
                padding: "14px 16px",
                borderRadius: "0 6px 6px 0",
                fontSize: 13,
                lineHeight: 1.75,
                borderLeft: isMatch
                  ? `3px solid ${LP.amber}`
                  : `1px solid ${LP.rule}`,
                background: isMatch
                  ? "rgba(255,159,28,0.07)"
                  : "transparent",
                transition: "background 0.2s",
              }}>
              {isMatch && (
                <div className="lp-mono" style={{ fontSize: 9, color: LP.amber, letterSpacing: 0.14,
                  textTransform: "uppercase", marginBottom: 8 }}>
                  ▶ Matched · score {result.score}
                </div>
              )}
              {isMatch
                ? <Snippet parts={result.snippet} mono={result.kind === "code"} />
                : <span style={{ color: LP.fg, whiteSpace: "pre-wrap", fontFamily: result.kind === "code" ? "monospace" : "inherit" }}>
                    {chunk.text}
                  </span>
              }
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Ring({ pct = 67, size = 280, filesLabel = "idle" }) {
  const r = (size - 28) / 2;
  const C = 2 * Math.PI * r;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={LP.rule} strokeWidth="2" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={LP.amber} strokeWidth="2"
          strokeDasharray={`${C * pct/100} ${C}`} strokeLinecap="round" />
        {[...Array(60)].map((_, i) => (
          <line key={i} x1={size/2} y1={6} x2={size/2} y2={12}
            transform={`rotate(${i*6} ${size/2} ${size/2})`}
            stroke={i*6/360 < pct/100 ? LP.amber : LP.rule2} strokeWidth="1" opacity={i % 5 === 0 ? 1 : 0.5} />
        ))}
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center" }}>
        <div className="lp-eyebrow" style={{ fontSize: 10 }}>Indexing</div>
        <div style={{ fontSize: 64, fontWeight: 600, letterSpacing: "-0.03em",
          fontFamily: LP.mono, marginTop: 6, color: LP.fg }}>
          {pct}<span style={{ fontSize: 28, color: LP.muted }}>%</span>
        </div>
        <div className="lp-mono" style={{ fontSize: 11, color: LP.muted, marginTop: 2, letterSpacing: 0 }}>
          {filesLabel}
        </div>
      </div>
    </div>
  );
}

function Indexing() {
  const stats = useStats();
  const refreshStats = useRefreshStats();
  const [indexJob, setIndexJob] = React.useState({ running: false, message: "idle" });
  const [statusRows, setStatusRows] = React.useState([]);

  const c = stats.total_chunks != null ? stats.total_chunks : 0;
  const f = stats.total_files != null ? stats.total_files : 0;
  const dirs = stats.corpus_dirs && stats.corpus_dirs.length > 0 ? stats.corpus_dirs.length : 1;
  const model = stats.embed_model || "nomic-embed-text";

  // Poll index status while running
  React.useEffect(() => {
    if (!indexJob.running) return;
    const iv = setInterval(() => {
      fetch(`${API_BASE}/api/index-status`).then(r => r.json()).then(d => {
        setIndexJob(d);
        if (!d.running) { refreshStats(); clearInterval(iv); }
      }).catch(() => clearInterval(iv));
    }, 2000);
    return () => clearInterval(iv);
  }, [indexJob.running]);

  // Live system checks on mount
  React.useEffect(() => {
    const rows = [];
    // ChromaDB: if stats loaded, DB is connected
    rows.push({ ok: stats.total_chunks != null, label: "chromadb", msg: stats.total_chunks != null ? `${stats.total_chunks.toLocaleString()} chunks` : "connecting…" });
    rows.push({ ok: true, label: "web server", msg: "running on port 7892" });
    rows.push({ ok: (stats.corpus_dirs || []).length > 0, label: "corpus", msg: (stats.corpus_dirs || []).length > 0 ? `${dirs} root${dirs!==1?'s':''} configured` : "no corpus dirs set" });
    rows.push({ ok: !!stats.embed_model, label: "embedder", msg: stats.embed_model || "not set" });
    setStatusRows(rows);
  }, [stats]);

  const triggerIndex = async () => {
    setIndexJob({ running: true, message: "starting…" });
    try {
      const r = await fetch(`${API_BASE}/api/index`, { method: "POST" });
      const d = await r.json();
      setIndexJob({ running: d.running !== false, message: d.message || "running…" });
    } catch(e) {
      setIndexJob({ running: false, message: "Error: server not running (start aether-logpose-ui)" });
    }
  };

  return (
    <div className="lp" style={{ position: "relative", width: "100%", flex: 1, overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1px 460px", height: "100%" }}>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
            <div>
              <div className="lp-eyebrow" style={{ marginBottom: 14 }}>
                <span style={{ color: LP.amber }}>●</span>&nbsp;&nbsp;Indexing status
              </div>
              <h2 className="lp-h2" style={{ fontSize: 36 }}>Watching {dirs} root{dirs !== 1 ? "s" : ""}</h2>
              <p style={{ color: LP.muted, fontSize: 14, marginTop: 10, maxWidth: 540 }}>
                Current database has <span className="lp-mono">{c.toLocaleString()}</span> chunks across <span className="lp-mono">{f.toLocaleString()}</span> files. Embedding via <span className="lp-mono">{model}</span>.
              </p>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="lp-row-btn" onClick={refreshStats}><Icon.refresh size={12}/> Refresh stats</button>
              <button className="lp-row-btn" onClick={triggerIndex} disabled={indexJob.running}
                style={{ opacity: indexJob.running ? 0.5 : 1 }}>
                <Icon.zap size={12}/> {indexJob.running ? "Indexing…" : "Re-index now"}
              </button>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", margin: "24px 0 44px" }}>
            <Ring pct={100} filesLabel={`${f.toLocaleString()} files indexed`} />
          </div>
          <div style={{ marginBottom: 36 }}>
            <div className="lp-mono" style={{ display: "flex", justifyContent: "space-between",
              fontSize: 11, color: LP.muted, marginBottom: 8, letterSpacing: 0 }}>
              <span>{indexJob.running ? indexJob.message : "Up to date"}</span>
              <span>{indexJob.running ? "running…" : "100%"}</span>

            <div style={{ height: 4, borderRadius: 999, background: LP.rule, position: "relative", overflow: "hidden" }}>

            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
            <StatTile label="Files indexed" value={f.toLocaleString()} sub={`across ${dirs} roots`} accent />
            <StatTile label="Total Chunks" value={c.toLocaleString()} sub="in ChromaDB" />
            <StatTile label="Last Sync" value={fmtAgo(stats.last_indexed)} sub="checked recently" />
          </div>
        </div>
        <div className="lp-vrule" />
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          <div style={{ padding: "20px 28px", borderBottom: `1px solid ${LP.rule}`,
            display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div className="lp-eyebrow">System status</div>
            <div className="lp-mono" style={{ fontSize: 11, color: LP.muted }}>aether-logpose-ui</div>
          </div>
          <div style={{ flex: 1, padding: "16px 28px", overflow: "auto", position: "relative",
            fontFamily: LP.mono, fontSize: 12, lineHeight: 1.85, color: LP.muted, letterSpacing: 0 }}>
            {statusRows.map((row, i) => (
              <div key={i} style={{ display: "flex", gap: 12 }}>
                <span style={{ color: row.ok ? "#3FCF75" : "#FF5555", width: 12 }}>{row.ok ? "✓" : "✗"}</span>
                <span style={{ color: LP.muted, width: 80 }}>{row.label}</span>
                <span style={{ color: LP.fg, flex: 1 }}>{row.msg}</span>
              </div>
            ))}
            {indexJob.message !== "idle" && (
              <div style={{ marginTop: 16, padding: "10px 12px", background: LP.amberDim,
                border: `1px solid ${LP.amberRule}`, borderRadius: 4, color: LP.fg, fontSize: 11 }}>
                {indexJob.running && <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%",
                  background: LP.amber, marginRight: 8 }} />}
                {indexJob.message}
                {indexJob.files > 0 && ` (${indexJob.indexed}/${indexJob.files} files)`}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Empty state / Onboarding — fully functional
// ─────────────────────────────────────────────────────────────────────────────
function EmptyState() {
  const navigate = useNav();
  const fetchStats = useRefreshStats();
  // phase: idle | uploading | indexing | done | error
  const [phase, setPhase] = React.useState("idle");
  const [status, setStatus] = React.useState("");
  const [job, setJob] = React.useState({});   // full _index_job snapshot
  const [pathVal, setPathVal] = React.useState("");
  const [dragOver, setDragOver] = React.useState(false);
  const fileInputRef = React.useRef(null);
  const folderInputRef = React.useRef(null);
  const pollRef = React.useRef(null);

  const stopPolling = () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };

  const startPolling = () => {
    stopPolling();
    pollRef.current = setInterval(() => {
      fetch(`${API_BASE}/api/index-status`)
        .then(r => r.json())
        .then(d => {
          setJob(d);
          setStatus(d.message || "");
          if (!d.running) {
            stopPolling();
            fetchStats();
            if ((d.message || "").startsWith("Error")) {
              setPhase("error");
            } else {
              setPhase("done");
              setTimeout(() => navigate("search"), 1800);
            }
          }
        }).catch(() => {});
    }, 800);
  };

  React.useEffect(() => stopPolling, []);

  // ── index a local path ────────────────────────────────────────────────────
  const indexPath = () => {
    const p = pathVal.trim();
    if (!p) return;
    setPhase("indexing"); setStatus("Starting…");
    fetch(`${API_BASE}/api/add-corpus`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: p }),
    }).then(r => r.json()).then(d => {
      if (d.ok) { setStatus(d.message); startPolling(); }
      else { setPhase("error"); setStatus(d.error || "Failed to add path"); }
    }).catch(() => { setPhase("error"); setStatus("Network error"); });
  };

  // ── upload files ──────────────────────────────────────────────────────────
  const uploadFiles = (fileList) => {
    const files = Array.from(fileList).filter(f => f.size > 0);
    if (!files.length) return;
    setPhase("uploading"); setStatus(`Uploading ${files.length} file${files.length > 1 ? "s" : ""}…`);
    const fd = new FormData();
    files.forEach(f => fd.append("files", f, f.webkitRelativePath || f.name));
    fetch(`${API_BASE}/api/upload`, { method: "POST", body: fd })
      .then(r => r.json())
      .then(d => {
        if (d.ok) { setPhase("indexing"); setStatus(d.message); startPolling(); }
        else { setPhase("error"); setStatus(d.error || "Upload failed"); }
      }).catch(() => { setPhase("error"); setStatus("Upload error"); });
  };

  // ── drag & drop ───────────────────────────────────────────────────────────
  const onDragOver = (e) => { e.preventDefault(); setDragOver(true); };
  const onDragLeave = () => setDragOver(false);
  const onDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    const items = e.dataTransfer.items;
    const files = [];
    // try webkitGetAsEntry for folders
    if (items && items.length > 0 && items[0].webkitGetAsEntry) {
      const traverseEntry = (entry, done) => {
        if (entry.isFile) {
          entry.file(f => { files.push(f); done(); });
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          const readAll = () => reader.readEntries(entries => {
            if (!entries.length) { done(); return; }
            let pending = entries.length;
            const check = () => { if (--pending === 0) done(); };
            entries.forEach(en => traverseEntry(en, check));
            readAll();
          });
          readAll();
        } else done();
      };
      let pending = items.length;
      const check = () => { if (--pending === 0 && files.length > 0) uploadFiles(files); };
      for (let i = 0; i < items.length; i++) {
        const entry = items[i].webkitGetAsEntry();
        if (entry) traverseEntry(entry, check);
        else check();
      }
    } else {
      uploadFiles(e.dataTransfer.files);
    }
  };

  // ── render helpers ────────────────────────────────────────────────────────
  const dropBorder = dragOver ? `2px dashed ${LP.amber}` : `2px dashed ${LP.amberRule}`;
  const dropBg = dragOver ? "rgba(255,159,28,0.08)" : "rgba(255,159,28,0.03)";

  // Progress derived from job snapshot
  const totalFiles  = job.files      || 0;
  const filesDone   = job.files_done || 0;
  const newIndexed  = job.indexed    || 0;
  const skipped     = job.skipped    || 0;
  const failed      = job.failed     || 0;
  const chunks      = job.chunks     || 0;
  const elapsed     = job.elapsed    || 0;
  const eta         = job.eta        || 0;
  const currentFile = job.current_file || "";
  const recent      = job.recent     || [];
  const pct = totalFiles > 0 ? Math.min(100, Math.round((filesDone / totalFiles) * 100)) : 0;

  const fmtTime = (s) => {
    if (s <= 0) return "—";
    if (s < 60) return `${Math.round(s)}s`;
    return `${Math.floor(s/60)}m ${Math.round(s%60)}s`;
  };

  return (
    <div className="lp" style={{ position: "relative", width: "100%", flex: 1, overflow: "hidden" }}>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", padding: "0 80px" }}>
        <div className="lp-grid" style={{ position: "absolute", inset: 0, opacity: 0.18 }}/>
        <div className="lp-radial-amber"/>

        <div style={{ position: "relative", textAlign: "center", width: "100%", maxWidth: 760 }}>

          {/* ── IDLE ── */}
          {phase === "idle" && (<>
            <div className="lp-eyebrow" style={{ marginBottom: 24 }}>● No corpus indexed</div>
            <h1 className="lp-h1" style={{ fontSize: 52, marginBottom: 16 }}>
              Point Logpose at your files.
            </h1>
            <p style={{ color: LP.muted, fontSize: 15, maxWidth: 500, margin: "0 auto 48px", lineHeight: 1.6 }}>
              Drop files or a folder, or paste a local path. Chunked, embedded via Ollama — never leaves this machine.
            </p>

            {/* Drop zone */}
            <div
              onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}
              onClick={() => folderInputRef.current && folderInputRef.current.click()}
              style={{ width: "100%", padding: "48px 40px", border: dropBorder, borderRadius: 10,
                background: dropBg, cursor: "pointer", transition: "border 0.15s, background 0.15s",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
              <div style={{ width: 52, height: 52, borderRadius: "50%",
                border: `1px solid ${dragOver ? LP.amber : LP.amberRule}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: dragOver ? LP.amberDim : "transparent",
                transition: "all 0.15s" }}>
                <Icon.upload size={20} stroke={LP.amber}/>
              </div>
              <div style={{ fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em" }}>
                {dragOver ? "Release to index" : "Drop files or folder here"}
              </div>
              <div style={{ fontSize: 12, color: LP.muted, fontFamily: LP.mono }}>
                PDF · DOCX · MD · TXT · code · EPUB · PNG/JPG via OCR
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 6 }}
                onClick={e => e.stopPropagation()}>
                <button className="lp-cta-amber"
                  onClick={() => folderInputRef.current && folderInputRef.current.click()}>
                  Choose folder…
                </button>
                <button className="lp-cta-ghost"
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                  Choose files…
                </button>
              </div>
            </div>

            {/* Hidden file inputs */}
            <input ref={folderInputRef} type="file" multiple webkitdirectory="" mozdirectory=""
              style={{ display: "none" }}
              onChange={e => uploadFiles(e.target.files)}/>
            <input ref={fileInputRef} type="file" multiple
              style={{ display: "none" }}
              onChange={e => uploadFiles(e.target.files)}/>

            {/* Path input */}
            <div style={{ marginTop: 28, color: LP.muted, fontSize: 13 }}>
              Or paste a local path (folder or file):
            </div>
            <div style={{ margin: "10px auto 0", display: "flex", gap: 8, maxWidth: 560 }}>
              <input className="lp-input lp-mono" value={pathVal}
                onChange={e => setPathVal(e.target.value)}
                onKeyDown={e => e.key === "Enter" && indexPath()}
                placeholder="/Users/you/Documents"
                style={{ flex: 1, paddingLeft: 14, fontSize: 13, letterSpacing: 0 }}/>
              <button className="lp-cta-amber" style={{ height: 44, flexShrink: 0 }}
                onClick={indexPath}>Index</button>
            </div>

            <div style={{ marginTop: 40, display: "flex", justifyContent: "center", gap: 24,
              fontSize: 11, color: LP.dim, fontFamily: LP.mono, letterSpacing: 0.1, textTransform: "uppercase" }}>
              <span><Icon.shield size={11} sw={1.4}/>&nbsp;&nbsp;Files never leave this machine</span>
              <span>·</span>
              <span><Icon.cpu size={11}/>&nbsp;&nbsp;Embeddings via Ollama</span>
            </div>
          </>)}

          {/* ── UPLOADING ── */}
          {phase === "uploading" && (
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:20 }}>
              <div style={{ width:52, height:52, borderRadius:"50%",
                border:`2px solid ${LP.amberRule}`, borderTopColor:LP.amber,
                animation:"lp-spin 0.8s linear infinite" }}/>
              <div style={{ fontSize:18, fontWeight:600 }}>{status}</div>
              <div style={{ fontSize:13, color:LP.muted }}>Saving to server…</div>
            </div>
          )}

          {/* ── INDEXING — full dashboard ── */}
          {phase === "indexing" && (
            <div style={{ width:"100%", textAlign:"left" }}>

              {/* Header row */}
              <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:28 }}>
                <div style={{ width:36, height:36, borderRadius:"50%", flexShrink:0,
                  border:`2px solid ${LP.amberRule}`, borderTopColor:LP.amber,
                  animation:"lp-spin 0.8s linear infinite" }}/>
                <div>
                  <div style={{ fontSize:20, fontWeight:600, letterSpacing:"-0.01em" }}>Indexing</div>
                  <div style={{ fontSize:12, color:LP.muted, fontFamily:LP.mono, marginTop:2 }}>
                    {currentFile || "scanning…"}
                  </div>
                </div>
                <div style={{ marginLeft:"auto", fontSize:13, color:LP.muted, fontFamily:LP.mono }}>
                  {pct}%
                </div>
              </div>

              {/* Progress bar */}
              <div style={{ width:"100%", height:6, background:LP.rule2, borderRadius:3, overflow:"hidden", marginBottom:24 }}>
                <div style={{ height:"100%", background:LP.amber, borderRadius:3,
                  width: totalFiles > 0 ? `${pct}%` : "0%",
                  transition:"width 0.6s ease",
                  animation: totalFiles === 0 ? "lp-progress-indeterminate 1.4s ease infinite" : "none" }}/>
              </div>

              {/* Stats grid */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:1,
                border:`1px solid ${LP.rule}`, borderRadius:8, overflow:"hidden", marginBottom:20 }}>
                {[
                  { label:"Files found",    val: totalFiles  > 0 ? totalFiles  : "…" },
                  { label:"Done",           val: totalFiles  > 0 ? `${filesDone} / ${totalFiles}` : "…" },
                  { label:"New chunks",     val: chunks      > 0 ? chunks.toLocaleString() : "—" },
                  { label:"Newly indexed",  val: newIndexed  > 0 ? newIndexed  : "—" },
                  { label:"Skipped",        val: skipped     > 0 ? skipped     : "—" },
                  { label:"Failed",         val: failed      > 0 ? failed      : "—",
                    color: failed > 0 ? "#FF4444" : undefined },
                  { label:"Elapsed",        val: fmtTime(elapsed) },
                  { label:"ETA",            val: fmtTime(eta) },
                  { label:"Rate",           val: elapsed > 0 && filesDone > 0
                    ? `${(filesDone/elapsed).toFixed(1)} f/s` : "—" },
                ].map(({ label, val, color }) => (
                  <div key={label} style={{ padding:"14px 16px", background:LP.card,
                    borderRight:`1px solid ${LP.rule}`, borderBottom:`1px solid ${LP.rule}` }}>
                    <div style={{ fontSize:11, color:LP.dim, fontFamily:LP.mono,
                      textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>
                      {label}
                    </div>
                    <div style={{ fontSize:18, fontWeight:600, fontFamily:LP.mono,
                      color: color || LP.fg, letterSpacing:"-0.02em" }}>
                      {val}
                    </div>
                  </div>
                ))}
              </div>

              {/* Recent files log */}
              {recent.length > 0 && (
                <div style={{ border:`1px solid ${LP.rule}`, borderRadius:8, overflow:"hidden" }}>
                  <div style={{ padding:"10px 16px", borderBottom:`1px solid ${LP.rule}`,
                    fontSize:11, color:LP.dim, fontFamily:LP.mono,
                    textTransform:"uppercase", letterSpacing:"0.08em" }}>
                    Recently indexed
                  </div>
                  {recent.map((f, i) => (
                    <div key={i} style={{ padding:"8px 16px", borderBottom: i < recent.length-1 ? `1px solid ${LP.rule}` : "none",
                      display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:6, height:6, borderRadius:"50%",
                        background: i === 0 ? LP.amber : LP.dim, flexShrink:0 }}/>
                      <div style={{ fontSize:13, fontFamily:LP.mono, color: i === 0 ? LP.fg : LP.muted,
                        overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                        {f}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── DONE ── */}
          {phase === "done" && (
            <div style={{ width:"100%", textAlign:"left" }}>
              {/* Header */}
              <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:28 }}>
                <div style={{ width:36, height:36, borderRadius:"50%",
                  background:LP.amberDim, border:`2px solid ${LP.amber}`,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:18, color:LP.amber, flexShrink:0 }}>✓</div>
                <div>
                  <div style={{ fontSize:20, fontWeight:600, color:LP.amber }}>Indexing complete</div>
                  <div style={{ fontSize:12, color:LP.muted, fontFamily:LP.mono, marginTop:2 }}>
                    Navigating to search…
                  </div>
                </div>
                <button className="lp-cta-amber" style={{ marginLeft:"auto", height:36, padding:"0 18px", fontSize:13 }}
                  onClick={() => navigate("search")}>
                  Search now →
                </button>
              </div>
              {/* Full bar */}
              <div style={{ width:"100%", height:6, background:LP.amberDim, borderRadius:3, marginBottom:24 }}>
                <div style={{ height:"100%", width:"100%", background:LP.amber, borderRadius:3 }}/>
              </div>
              {/* Final stats */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:1,
                border:`1px solid ${LP.rule}`, borderRadius:8, overflow:"hidden", marginBottom:20 }}>
                {[
                  { label:"Total files",   val: totalFiles.toLocaleString() },
                  { label:"Newly indexed", val: newIndexed.toLocaleString() },
                  { label:"Chunks",        val: chunks.toLocaleString() },
                  { label:"Skipped",       val: skipped.toLocaleString() },
                  { label:"Failed",        val: failed.toLocaleString(), color: failed > 0 ? "#FF4444" : undefined },
                  { label:"Time",          val: fmtTime(elapsed) },
                ].map(({ label, val, color }) => (
                  <div key={label} style={{ padding:"14px 16px", background:LP.card,
                    borderRight:`1px solid ${LP.rule}`, borderBottom:`1px solid ${LP.rule}` }}>
                    <div style={{ fontSize:11, color:LP.dim, fontFamily:LP.mono,
                      textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>{label}</div>
                    <div style={{ fontSize:18, fontWeight:600, fontFamily:LP.mono,
                      color: color || LP.fg }}>{val}</div>
                  </div>
                ))}
              </div>
              {recent.length > 0 && (
                <div style={{ border:`1px solid ${LP.rule}`, borderRadius:8, overflow:"hidden" }}>
                  <div style={{ padding:"10px 16px", borderBottom:`1px solid ${LP.rule}`,
                    fontSize:11, color:LP.dim, fontFamily:LP.mono, textTransform:"uppercase", letterSpacing:"0.08em" }}>
                    Last indexed
                  </div>
                  {recent.slice(0,6).map((f, i) => (
                    <div key={i} style={{ padding:"8px 16px",
                      borderBottom: i < Math.min(5, recent.length-1) ? `1px solid ${LP.rule}` : "none",
                      display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:6, height:6, borderRadius:"50%", background:LP.amber, flexShrink:0 }}/>
                      <div style={{ fontSize:13, fontFamily:LP.mono, color:LP.muted,
                        overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{f}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── ERROR ── */}
          {phase === "error" && (
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:20 }}>
              <div style={{ width:64, height:64, borderRadius:"50%",
                border:`1px solid #FF4444`, background:"rgba(255,68,68,0.08)",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:26, color:"#FF4444" }}>✕</div>
              <div style={{ fontSize:18, fontWeight:600, color:"#FF4444" }}>Indexing failed</div>
              <div style={{ fontSize:13, color:LP.muted, fontFamily:LP.mono, maxWidth:480 }}>{status}</div>
              <button className="lp-cta-ghost" style={{ marginTop:8 }}
                onClick={() => { setPhase("idle"); setStatus(""); setPathVal(""); }}>
                Try again
              </button>
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

function Architecture() {
  const stages = [
    { num: "01", title: "Embed", body: "Chunks pass through a local Ollama embedding model. The resulting vectors are written to a SQLite-backed column store on disk.",
      tag: "nomic-embed-text · 768d", icon: <Icon.zap size={16} stroke={LP.amber}/> },
    { num: "02", title: "BM25", body: "In parallel, an SQLite FTS5 index scores chunks lexically. Captures exact terms, identifiers, numbers, names — anything dense vectors blur.",
      tag: "FTS5 · BM25", icon: <Icon.code size={16} stroke={LP.amber}/> },
    { num: "03", title: "RRF", body: "Reciprocal Rank Fusion combines the two ordered lists into a single ranking. No tuning, no weights — just rank-based agreement.",
      tag: "k = 60", icon: <Icon.refresh size={16} stroke={LP.amber}/> },
    { num: "04", title: "Cross-encoder", body: "The top 50 candidates are re-scored together with the query by a cross-encoder. Slow, accurate, last in line.",

        <div className="lp-mono" style={{ marginBottom: 88, padding: 24, border: `1px solid ${LP.rule}`,

          onClick={() => onSelect(item.id)}
          style={{
            position: "relative",
            width: 40, height: 36, border: "none", cursor: "pointer",

};
const TAB_ORDER = ["home", "search", "indexing", "settings", "empty", "arch", "editorial", "quiet"];

// ── Settings sub-components that need stats context ─────────────────────────
function CorpusSection() {
  const stats = useStats();
  const dirs = stats.corpus_dirs && stats.corpus_dirs.length > 0 ? stats.corpus_dirs : ["~/Documents"];
  const c = stats.total_chunks != null ? stats.total_chunks.toLocaleString() : "…";
  const f = stats.total_files != null ? stats.total_files.toLocaleString() : "…";
  return (
    <>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
        {dirs.map(d => (
          <span key={d} style={{ display: "inline-flex", alignItems: "center", gap: 8, height: 30,
            padding: "0 4px 0 12px", borderRadius: 999, border: `1px solid ${LP.rule2}`,
            fontSize: 13, fontFamily: LP.mono, fontWeight: 500, color: LP.fg, letterSpacing: 0 }}>
            {d}
            <span style={{ width: 22, height: 22, borderRadius: "50%", display: "inline-flex",
              alignItems: "center", justifyContent: "center", color: LP.muted, cursor: "pointer" }}>
              <Icon.close size={11}/>
            </span>
          </span>
        ))}
        <button className="lp-pill"><Icon.plus size={11}/> Add folder</button>
      </div>
      <div className="lp-mono" style={{ fontSize: 11, color: LP.muted }}>
        {dirs.length} root{dirs.length !== 1 ? "s" : ""} · {c} chunks · {f} files
      </div>
    </>
  );
}

function EmbedModelSection({ Field }) {
  const stats = useStats();
  const model = stats.embed_model || "nomic-embed-text";
  return (
    <Field>
      <span><span style={{ fontFamily: LP.mono, color: LP.muted, fontSize: 12, marginRight: 10 }}>ollama</span>
        {model} <span style={{ color: LP.muted, fontSize: 12 }}>· local</span></span>
      <Icon.chevR size={14} stroke={LP.muted}/>
    </Field>
  );
}

function App() {
  const initial = (typeof location !== "undefined" && SCREENS[location.hash.slice(1)])
    ? location.hash.slice(1) : "home";
  const [tab, setTab] = React.useState(initial);
  const [stats, setStats] = React.useState({});

  const fetchStats = React.useCallback(() => {
    fetch(`${API_BASE}/api/stats`)
      .then(r => r.json())
      .then(d => { if (!d.error) setStats(d); })
      .catch(() => {});
  }, []);

  React.useEffect(() => {
    const onHash = () => { 
      const raw = location.hash.slice(1);
      const k = raw.split("?")[0];
      if (SCREENS[k]) setTab(k); 
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  React.useEffect(() => { fetchStats(); }, [fetchStats]);

  const choose = (k) => { setTab(k); location.hash = k; };

  // If no corpus indexed yet and user is on home, show onboarding instead
  const hasCorpus = stats.total_chunks > 0;
  const effectiveTab = (!hasCorpus && tab === "home") ? "empty" : tab;
  const Render = SCREENS[effectiveTab] ? SCREENS[effectiveTab].render : SCREENS["home"].render;

  return (
    <StatsCtx.Provider value={stats}>
      <StatsRefreshCtx.Provider value={fetchStats}>
      <NavCtx.Provider value={choose}>
      <div style={{ display: "flex", height: "100vh", width: "100vw",
        overflow: "hidden", background: LP.bg }}>
        <SideNav tab={effectiveTab} onSelect={choose}/>
        {/* Content area — height:100% so child screens can fill with position:absolute */}
        <div style={{ flex: 1, minWidth: 0, height: "100vh",
          overflow: effectiveTab === "search" ? "hidden" : "auto",
          display: "flex", flexDirection: "column", position: "relative" }}>
          <Render/>
        </div>
      </div>
      </NavCtx.Provider>
      </StatsRefreshCtx.Provider>
    </StatsCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
