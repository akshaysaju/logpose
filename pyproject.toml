[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpose-ui"
version = "1.0.0"
description = "Logpose — local document intelligence web UI (System 2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akshay" }]
keywords = ["semantic-search", "rag", "ollama", "chromadb", "flask"]

dependencies = [
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "anyio>=4.0.0",
    "watchfiles>=0.20",
    "flask>=3.1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    # Document parsers
    "pdfplumber>=0.11.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ebooklib>=0.18",
    "striprtf>=0.0.26",
    # OCR  (requires: brew install tesseract poppler)
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    # Cross-encoder reranker
    "sentence-transformers>=3.0",
]
minimal = [
    "pdfplumber>=0.11.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
aether-logpose-ui = "logpose.web_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logpose*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
addopts     = "-q"
